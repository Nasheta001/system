# nginx for the Angular build. Used by docker-compose (production-like local
# stack) or any container host. On AWS the same role is played by CloudFront
# with the response-headers policy in deploy/aws/app-stack.yaml.
server_tokens off;

map $uri $spa_cache {
    default              "no-cache";
    "~*\.[0-9a-z]{8,}\.(js|css)$" "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 12m;

    set $csp "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";

    # Re-resolve the backend through Docker's DNS so a restarted/redeployed backend
    # container (new IP) is picked up without restarting nginx. 127.0.0.11 is the
    # Docker embedded DNS; adjust for other container hosts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # API, admin and static files are proxied to Django (Django sets its own headers)
    location ~ ^/(api|django-admin|static)/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Public property photos (local storage only; on AWS these come from S3 via CloudFront)
    location /media/ {
        alias /data/media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        # Only extension-less paths (app routes) fall back to index.html. A missing
        # file such as an old chunk-*.js after a redeploy must be a real 404, not
        # HTML served as JavaScript (same rule as the CloudFront function on AWS).
        try_files $uri $uri/ @app;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cache-Control $spa_cache always;
    }

    location @app {
        if ($uri ~ "\.[A-Za-z0-9]+$") { return 404; }
        rewrite ^ /index.html last;
    }
}
