# Render Blueprint: Django API (Docker) + PostgreSQL, both in Frankfurt.
# The Angular frontend is deployed separately on Vercel (frontend/vercel.json proxies /api and /media here).
#
# Values marked "sync: false" are NOT stored in this file: Render asks for them when the Blueprint is
# first created (Dashboard -> Blueprints -> New Blueprint Instance). Never commit real secrets here.
#
# Plans: a persistent disk requires a paid web service plan (starter or higher), and a free database
# expires after 30 days, so paid plans are set below. Change them in the dashboard if you prefer.

databases:
  - name: propman-db
    databaseName: propman
    user: propman
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "17"
    ipAllowList: []            # no access from the internet; only Render services in the same region

services:
  - type: web
    name: propman-api
    runtime: docker
    region: frankfurt
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/
    preDeployCommand: /app/docker-entrypoint.sh migrate   # migrations + cache table + defaults
    autoDeploy: true
    disk:
      name: propman-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: propman-db
          property: connectionString
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEYS
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false            # e.g. propman-api.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false            # e.g. https://your-app.vercel.app
      - key: FRONTEND_URL
        sync: false            # e.g. https://your-app.vercel.app (used in invitation and reset links)
      - key: SECURE_HTTPS
        value: "true"
      - key: NUM_PROXIES
        value: "2"             # Vercel rewrite + Render proxy; verify client IPs in the audit log after deploy
      - key: CACHE_BACKEND
        value: db
      - key: LOG_FORMAT
        value: json
      - key: MEDIA_ROOT
        value: /data/media
      - key: PRIVATE_MEDIA_ROOT
        value: /data/private_media
      - key: MPESA_MODE
        value: disabled
      - key: MPESA_CALLBACK_TOKEN
        generateValue: true
      - key: NOTIFY_EMAIL_ENABLED
        value: "false"
      - key: EMAIL_BACKEND
        sync: false            # django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false            # smtp.gmail.com
      - key: EMAIL_PORT
        sync: false            # 587
      - key: EMAIL_USE_TLS
        sync: false            # true
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
