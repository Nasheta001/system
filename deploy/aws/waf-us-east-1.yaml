AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AWS WAF web ACL for the property management CloudFront distribution.
  MUST be deployed in us-east-1 (CloudFront-scoped WAF). Pass the WebAclArn
  output to app-stack.yaml. NOT YET DEPLOYED OR TESTED IN AN AWS ACCOUNT.

Parameters:
  EnableBotControl:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: AWS Managed Bot Control (extra monthly + per-request cost).
  LoginRateLimit:
    Type: Number
    Default: 100
    MinValue: 10
    Description: Max requests per 5 minutes per IP to /api/auth/ endpoints.
  GlobalRateLimit:
    Type: Number
    Default: 3000
    MinValue: 100
    Description: Max requests per 5 minutes per IP overall.

Conditions:
  BotControl: !Equals [!Ref EnableBotControl, "true"]

Resources:
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: propman-cloudfront
      Scope: CLOUDFRONT
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: propman-waf
      Rules:
        - Name: AuthRateLimit
          Priority: 0
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: !Ref LoginRateLimit
              AggregateKeyType: IP
              ScopeDownStatement:
                ByteMatchStatement:
                  FieldToMatch: { UriPath: {} }
                  PositionalConstraint: STARTS_WITH
                  SearchString: /api/auth/
                  TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: auth-rate }
        - Name: GlobalRateLimit
          Priority: 1
          Action: { Block: {} }
          Statement:
            RateBasedStatement: { Limit: !Ref GlobalRateLimit, AggregateKeyType: IP }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: global-rate }
        - Name: AmazonIpReputation
          Priority: 2
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: ip-reputation }
        - Name: CommonRules
          Priority: 3
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              # Uploads (photos, documents) exceed the 8 KB body inspection limit; Django validates them.
              RuleActionOverrides:
                - Name: SizeRestrictions_BODY
                  ActionToUse: { Count: {} }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: common }
        - Name: KnownBadInputs
          Priority: 4
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: bad-inputs }
        - Name: SQLi
          Priority: 5
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesSQLiRuleSet }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: sqli }
        - !If
          - BotControl
          - Name: BotControl
            Priority: 6
            OverrideAction: { None: {} }
            Statement:
              ManagedRuleGroupStatement:
                VendorName: AWS
                Name: AWSManagedRulesBotControlRuleSet
                ManagedRuleGroupConfigs:
                  - AWSManagedRulesBotControlRuleSet: { InspectionLevel: COMMON }
                # Safaricom's M-Pesa callbacks are machine traffic and must not be challenged.
                ScopeDownStatement:
                  NotStatement:
                    Statement:
                      ByteMatchStatement:
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: STARTS_WITH
                        SearchString: /api/payments/mpesa/callback/
                        TextTransformations: [{ Priority: 0, Type: NONE }]
            VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: bot-control }
          - !Ref AWS::NoValue

Outputs:
  WebAclArn:
    Value: !GetAtt WebAcl.Arn
    Description: Pass to app-stack.yaml as WebAclArn
